# Runs the package's test suite under Intel's Software Development Emulator,
# so that every x86 target is exercised regardless of the runner's CPU. For
# each emulated CPU the test asserts which target dynamic dispatch chose, and
# test_all_targets.R then runs every compiled target the emulated CPU
# supports.
#
# The oldest emulated CPU is Haswell: the runner's system libraries (even the
# dynamic loader) execute AVX instructions, so emulating an earlier CPU stops
# before R starts. SSE4 and SSSE3 code is still forced and tested on each
# emulated CPU by test_all_targets.R; SSE2 is compiled only where the
# toolchain baseline is plain x86-64 and runs natively on the Windows runners.
#
# SDE is downloaded at run time from Intel's official mirror and verified
# against the SHA-256 Intel publishes; it is not redistributed. Licence:
# Intel Simplified Software License (see dev/DESIGN.md).
name: intel-sde

on:
  push:
    branches: [main]
    paths: ['src/**', 'inst/include/**', 'inst/tinytest/**', 'R/**', '.github/workflows/sde.yaml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SDE_VERSION: 10.13.1-2026-07-28
  SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
  SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50

jobs:
  sde:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytest
          dependencies: '"hard"'

      - name: Cache SDE
        id: cache-sde
        uses: actions/cache@v4
        with:
          path: ~/sde.tar.xz
          key: sde-${{ env.SDE_VERSION }}-${{ env.SDE_SHA256 }}

      - name: Download SDE
        if: steps.cache-sde.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o ~/sde.tar.xz "$SDE_URL"

      - name: Verify and unpack SDE
        run: |
          echo "$SDE_SHA256  $HOME/sde.tar.xz" | sha256sum -c -
          mkdir -p ~/sde && tar -xJf ~/sde.tar.xz -C ~/sde --strip-components=1
          # Pin attaches to the program it launches.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          ~/sde/sde64 -version | head -n 3

      - name: CPU model and native targets
        run: |
          lscpu | grep -E 'Model name'
          R CMD INSTALL .
          Rscript -e 'library(highway); cat("native supported:", supported_targets(), "\ncompiled:", compiled_targets(), "\n")'

      - name: Test suite under emulated CPUs
        run: |
          status=0
          while read -r cpu expected; do
            echo "::group::sde64 -$cpu (expect $expected)"
            if ~/sde/sde64 -"$cpu" -- Rscript -e "
                library(highway)
                cat('emulated CPU: $cpu\nsupported:', supported_targets(), '\ndispatched:', dispatched_target(), '\n')
                stopifnot(identical(dispatched_target(), '$expected'))
                tinytest::test_package('highway')"; then
              echo "$cpu: OK ($expected)" >> sde-summary.txt
            else
              echo "$cpu: FAILED (expected $expected)" >> sde-summary.txt
              status=1
            fi
            echo "::endgroup::"
          done <<'EOF'
          hsw AVX2
          skx AVX3
          icx AVX3_DL
          spr AVX3_SPR
          dmr AVX10_2
          EOF
          cat sde-summary.txt
          exit $status
